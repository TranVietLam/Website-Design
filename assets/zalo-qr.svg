    <rect x="92" y="48" width="12" height="12" rx="2"/>
    <rect x="112" y="48" width="18" height="10" rx="2"/>
    <rect x="94" y="68" width="14" height="14" rx="2"/>
    <rect x="116" y="66" width="14" height="18" rx="2"/>

    <rect x="48" y="94" width="12" height="12" rx="2"/>
    <rect x="68" y="94" width="14" height="10" rx="2"/>
